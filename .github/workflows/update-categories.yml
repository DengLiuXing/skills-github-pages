name: Update categories.json

on:
  push:
    branches: [main]
    paths:
      - '_posts/**'
      - 'scripts/update-categories.js'
      - '.github/workflows/update-categories.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Regenerate categories.json
        run: node scripts/update-categories.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add categories.json
          if git diff --cached --quiet; then
            echo "categories.json 无需更新"
          else
            git commit -m "chore: 自动更新 categories.json"
            git push
          fi
